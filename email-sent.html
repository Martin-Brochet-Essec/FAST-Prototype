<!DOCTYPE html>

<body>
<div class="device">
  <div class="langswitch">

    <button class="langbtn" data-lang="es" onclick="FAST.setLang('es')">ES</button>

  <div class="statusbar"><span>9:41</span><span class="brandmark">FAST</span></div>
  <div class="menu-overlay" id="menuOverlay" onclick="if(event.target===this) FAST.closeMenu()">

      <a class="menu-item" href="profile.html" data-i18n="menu_profil">Profil</a>

  </div>

  <div class="constellation" style="margin-bottom:24px;">
    <div class="node n-i"></div><div class="node n-f"></div><div class="node n-e"></div><div class="node n-s"></div>
  </div>

</div>
<div class="spacer"></div>
<a class="btn btn-text" href="email-backup.html" data-i18n="mailsent_noreceived">Je n'ai rien reçu</a>
